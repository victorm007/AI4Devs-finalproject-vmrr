openapi: 3.2.0
info:
  title: API REST - Gestión de Medicamentos Hogar Gerontológico
  version: 1.0.0
  summary: Inventario de medicamentos por entidad (Hogar y residentes) para el MVP.
  description: |
    **Alcance (extensión `x-alcance` en cada operación)**
    - `MVP`: 3 endpoints de **solo lectura** que se implementan en el MVP:
      `GET /existencias`, `GET /medicamentos` y `GET /reportes/mensual`.
      Usan la cookie de sesión que se obtiene al iniciar sesión en la aplicación web;
      cualquier usuario autenticado (de cualquier nivel) puede consultarlos.
    - `V2`: el resto del contrato, diseñado para una versión posterior con clientes externos
      (por ejemplo, una app móvil). En el MVP esas operaciones se hacen desde las pantallas web,
      que usan la misma capa de servicios y las mismas reglas.

    Contrato objetivo de la API REST. Cubre:

    1. Inicio de sesión y 2 niveles de acceso.
    2. Catálogo de medicamentos (alta, baja lógica y cambio), con principio activo, presentación y búsqueda sin acentos.
    3. Residentes (alta, baja y cambio), con el Hogar como entidad fija.
    4. Movimientos: entrada, transferencia, baja con motivo y corrección.
    5. Consulta de existencias por residente, medicamento o principio activo.
    6. Conteo físico: captura, diferencia contra lo registrado y cierre.
    7. Reporte mensual de movimientos y saldos.

    **Convenciones**
    - JSON en UTF-8, nombres de campos en `snake_case` y en español.
    - Las cantidades están **en dosis**, son números decimales con 2 posiciones (admiten 0.5).
    - Fechas `YYYY-MM-DD`; fechas con hora en ISO 8601 con zona horaria.
    - Errores con **Problem Details (RFC 9457)**, `application/problem+json`, con un `code` estable para la aplicación.
    - Las peticiones rechazan campos desconocidos (`additionalProperties: false`).
    - Los movimientos son inmutables: no existen `PUT`, `PATCH` ni `DELETE` sobre ellos (`405`).

    **Autenticación:** sesión de Django en la cookie `sessionid` (expira tras 30 min de inactividad).
    Toda petición que modifica datos (`POST`, `PUT`, `PATCH`, `DELETE`) debe enviar la cabecera
    `X-CSRFToken` con el valor de la cookie `csrftoken`, que se obtiene con `GET /auth/csrf`.

    **Niveles de acceso** (extensión `x-nivel-acceso` en cada operación):
    - `SOLO_LECTURA`: cualquier usuario autenticado.
    - `LECTURA_ESCRITURA`: usuarios del grupo *Lectura y escritura* y el Administrador.

    La gestión de usuarios se hace en el panel `/admin/` de Django y no forma parte de esta API en el MVP.
  contact:
    name: Victor Manuel Ramirez Ruvalcaba
  license:
    name: Uso privado del proyecto
    identifier: LicenseRef-Privado
servers:
  - url: https://{host}/api/v1
    description: Servidor local (red del hogar) o VPS
    variables:
      host:
        default: localhost
        description: Nombre o IP del servidor

security:
  - sesion: []

tags:
  - name: Autenticación
    summary: Inicio y cierre de sesión
    description: Sesión de Django con protección CSRF y bloqueo por intentos fallidos.
  - name: Catálogos
    summary: Presentaciones, motivos de baja y principios activos
    description: Catálogos de apoyo. Las presentaciones y los motivos vienen de los datos semilla.
  - name: Medicamentos
    summary: Catálogo de medicamentos (alta, baja lógica, cambio y búsqueda)
    description: La unicidad (nombre comercial, presentación y concentración) no distingue mayúsculas ni acentos.
  - name: Entidades
    summary: El Hogar y los residentes (dueños de existencias)
    description: El Hogar es una entidad fija creada en la instalación; no tiene operaciones de escritura.
  - name: Residentes
    summary: Alta, cambio y egreso o defunción de residentes
    description: Los residentes no se borran; el egreso o la defunción son una baja lógica.
  - name: Movimientos
    summary: Entradas, transferencias, bajas y correcciones (inmutables)
    description: Cada movimiento actualiza las existencias en la misma transacción. Los errores se corrigen con el movimiento inverso.
  - name: Existencias
    summary: Saldos en dosis por entidad y medicamento
    description: Solo lectura; los saldos cambian únicamente a través de movimientos.
  - name: Conteos
    summary: Conteo físico contra lo registrado
    description: El conteo compara lo físico con el saldo registrado; cerrarlo no ajusta existencias.
  - name: Reportes
    summary: Reporte mensual de movimientos y saldos
    description: Se calcula al momento a partir de los movimientos.

paths:
  # ------------------------------------------------------------------
  # 1. Autenticación
  # ------------------------------------------------------------------
  /auth/csrf:
    get:
      tags: [Autenticación]
      operationId: obtenerCsrf
      x-alcance: V2
      summary: Obtener la cookie CSRF
      description: Entrega la cookie `csrftoken`, necesaria para iniciar sesión y para toda petición que modifica datos.
      security: []
      responses:
        '204':
          description: Cookie entregada.
          headers:
            Set-Cookie:
              description: 'csrftoken=<valor>; Path=/; Secure; SameSite=Lax'
              schema:
                type: string

  /auth/login:
    post:
      tags: [Autenticación]
      operationId: iniciarSesion
      x-alcance: V2
      summary: Iniciar sesión
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              operador:
                summary: Usuario de lectura y escritura del dataset demo
                dataValue:
                  username: operador.demo
                  password: DemoEscritura2026!
      responses:
        '200':
          description: Sesión iniciada.
          headers:
            Set-Cookie:
              description: 'sessionid=<valor>; Path=/; HttpOnly; Secure; SameSite=Lax'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioActual'
              examples:
                operador:
                  dataValue:
                    id: 2
                    username: operador.demo
                    nombre: Jorge Salinas Pérez
                    nivel_acceso: LECTURA_ESCRITURA
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          description: Usuario o contraseña incorrectos, o usuario desactivado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                credenciales:
                  dataValue:
                    type: https://hogar.example/errores/credenciales-invalidas
                    title: Credenciales inválidas
                    status: 401
                    code: CREDENCIALES_INVALIDAS
                    detail: Usuario o contraseña incorrectos.
                    instance: /api/v1/auth/login
        '403':
          $ref: '#/components/responses/CsrfInvalido'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /auth/logout:
    post:
      tags: [Autenticación]
      operationId: cerrarSesion
      x-alcance: V2
      summary: Cerrar sesión
      security:
        - sesion: []
          csrf: []
      responses:
        '204':
          description: Sesión cerrada.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CsrfInvalido'

  /auth/me:
    get:
      tags: [Autenticación]
      operationId: obtenerUsuarioActual
      x-alcance: V2
      summary: Usuario de la sesión y su nivel de acceso
      x-nivel-acceso: SOLO_LECTURA
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioActual'
              examples:
                consulta:
                  dataValue:
                    id: 1
                    username: consulta.demo
                    nombre: Laura Méndez Castro
                    nivel_acceso: SOLO_LECTURA
        '401':
          $ref: '#/components/responses/NoAutenticado'

  # ------------------------------------------------------------------
  # Catálogos de apoyo
  # ------------------------------------------------------------------
  /presentaciones:
    get:
      tags: [Catálogos]
      operationId: listarPresentaciones
      x-alcance: V2
      summary: Listar presentaciones activas
      x-nivel-acceso: SOLO_LECTURA
      responses:
        '200':
          description: Presentaciones ordenadas por nombre.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Presentacion'
              examples:
                semilla:
                  dataValue:
                    - { id: 2, nombre: cápsula }
                    - { id: 4, nombre: gotas }
                    - { id: 3, nombre: jarabe }
                    - { id: 1, nombre: tableta }
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /motivos-baja:
    get:
      tags: [Catálogos]
      operationId: listarMotivosBaja
      x-alcance: V2
      summary: Listar motivos de baja activos
      description: '`CORRECCION` aparece en el listado, pero está reservado para `POST /movimientos/{id}/correccion`.'
      x-nivel-acceso: SOLO_LECTURA
      responses:
        '200':
          description: Motivos de baja.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MotivoBaja'
              examples:
                semilla:
                  dataValue:
                    - { id: 1, clave: CONSUMO, descripcion: Consumo / administración }
                    - { id: 2, clave: CADUCIDAD, descripcion: Caducidad }
                    - { id: 3, clave: MERMA, descripcion: Merma }
                    - { id: 4, clave: ROTURA, descripcion: Rotura }
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /principios-activos:
    get:
      tags: [Catálogos]
      operationId: listarPrincipiosActivos
      x-alcance: V2
      summary: Buscar principios activos
      x-nivel-acceso: SOLO_LECTURA
      parameters:
        - $ref: '#/components/parameters/Busqueda'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Principios activos que coinciden (sin distinguir mayúsculas ni acentos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaPrincipiosActivos'
              examples:
                losartan:
                  summary: GET /principios-activos?q=losartan
                  dataValue:
                    total: 1
                    pagina: 1
                    por_pagina: 20
                    resultados:
                      - { id: 2, nombre: Losartán }
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      tags: [Catálogos]
      operationId: crearPrincipioActivo
      x-alcance: V2
      summary: Dar de alta un principio activo
      x-nivel-acceso: LECTURA_ESCRITURA
      security:
        - sesion: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrincipioActivoCrear'
            examples:
              amlodipino:
                dataValue:
                  nombre: Amlodipino
      responses:
        '201':
          description: Principio activo creado.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipioActivo'
              examples:
                amlodipino:
                  dataValue: { id: 14, nombre: Amlodipino }
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          description: Ya existe un principio activo con ese nombre (sin distinguir mayúsculas ni acentos).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                duplicado:
                  dataValue:
                    type: https://hogar.example/errores/principio-activo-duplicado
                    title: Principio activo duplicado
                    status: 409
                    code: PRINCIPIO_ACTIVO_DUPLICADO
                    detail: Ya existe el principio activo "Losartán".
                    instance: /api/v1/principios-activos

  # ------------------------------------------------------------------
  # 2. Medicamentos
  # ------------------------------------------------------------------
  /medicamentos:
    get:
      tags: [Medicamentos]
      operationId: listarMedicamentos
      x-alcance: MVP
      summary: Buscar medicamentos
      description: |
        `q` busca por coincidencia parcial en el nombre comercial **o** en el nombre de cualquiera de sus
        principios activos, sin distinguir mayúsculas ni acentos. Requiere al menos 3 caracteres.
      x-nivel-acceso: SOLO_LECTURA
      parameters:
        - $ref: '#/components/parameters/Busqueda'
        - name: principio_activo_id
          in: query
          description: Solo medicamentos que contienen este principio activo.
          schema:
            $ref: '#/components/schemas/Id'
        - name: tipo
          in: query
          schema:
            $ref: '#/components/schemas/TipoMedicamento'
        - name: presentacion_id
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: activo
          in: query
          description: '`true` (por defecto) solo vigentes; `false` solo dados de baja.'
          schema:
            type: boolean
            default: true
        - name: orden
          in: query
          schema:
            type: string
            enum: [nombre_comercial, -nombre_comercial, creado_en, -creado_en]
            default: nombre_comercial
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Página de medicamentos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaMedicamentos'
              examples:
                losartan:
                  summary: GET /medicamentos?q=losartan
                  dataValue:
                    total: 3
                    pagina: 1
                    por_pagina: 20
                    resultados:
                      - id: 3
                        nombre_comercial: Cozaar
                        tipo: ORIGINAL
                        presentacion: { id: 1, nombre: tableta }
                        concentracion: 50 mg
                        principios_activos: [{ id: 2, nombre: Losartán }]
                        activo: true
                        creado_en: '2026-09-01T08:00:00-06:00'
                        actualizado_en: '2026-09-01T08:00:00-06:00'
                      - id: 4
                        nombre_comercial: Hyzaar
                        tipo: ORIGINAL
                        presentacion: { id: 1, nombre: tableta }
                        concentracion: 50 mg / 12.5 mg
                        principios_activos: [{ id: 2, nombre: Losartán }, { id: 3, nombre: Hidroclorotiazida }]
                        activo: true
                        creado_en: '2026-09-01T08:00:00-06:00'
                        actualizado_en: '2026-09-01T08:00:00-06:00'
                      - id: 2
                        nombre_comercial: Losartán
                        tipo: GENERICO
                        presentacion: { id: 1, nombre: tableta }
                        concentracion: 50 mg
                        principios_activos: [{ id: 2, nombre: Losartán }]
                        activo: true
                        creado_en: '2026-09-01T08:00:00-06:00'
                        actualizado_en: '2026-09-01T08:00:00-06:00'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      tags: [Medicamentos]
      operationId: crearMedicamento
      x-alcance: V2
      summary: Dar de alta un medicamento
      x-nivel-acceso: LECTURA_ESCRITURA
      security:
        - sesion: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicamentoCrear'
            examples:
              amlodipino:
                dataValue:
                  nombre_comercial: Amlodipino
                  tipo: GENERICO
                  presentacion_id: 1
                  concentracion: 5 mg
                  principios_activos_ids: [14]
              duplicado:
                summary: Provoca 409 MEDICAMENTO_DUPLICADO (ya existe "Losartán 50 mg tableta")
                dataValue:
                  nombre_comercial: LOSARTAN
                  tipo: GENERICO
                  presentacion_id: 1
                  concentracion: 50 MG
                  principios_activos_ids: [2]
      responses:
        '201':
          description: Medicamento creado.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medicamento'
              examples:
                amlodipino:
                  dataValue:
                    id: 16
                    nombre_comercial: Amlodipino
                    tipo: GENERICO
                    presentacion: { id: 1, nombre: tableta }
                    concentracion: 5 mg
                    principios_activos: [{ id: 14, nombre: Amlodipino }]
                    activo: true
                    creado_en: '2026-10-19T10:15:00-06:00'
                    actualizado_en: '2026-10-19T10:15:00-06:00'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/MedicamentoDuplicado'
        '422':
          description: Una presentación o un principio activo indicado no existe o está inactivo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                principio:
                  dataValue:
                    type: https://hogar.example/errores/referencia-invalida
                    title: Referencia inválida
                    status: 422
                    code: REFERENCIA_INVALIDA
                    detail: El principio activo 99 no existe.
                    instance: /api/v1/medicamentos
                    errores:
                      - { campo: 'principios_activos_ids[0]', codigo: REFERENCIA_INVALIDA, mensaje: El principio activo 99 no existe. }

  /medicamentos/{medicamento_id}:
    parameters:
      - $ref: '#/components/parameters/MedicamentoId'
    get:
      tags: [Medicamentos]
      operationId: obtenerMedicamento
      x-alcance: V2
      summary: Obtener un medicamento
      x-nivel-acceso: SOLO_LECTURA
      responses:
        '200':
          description: Medicamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medicamento'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    patch:
      tags: [Medicamentos]
      operationId: actualizarMedicamento
      x-alcance: V2
      summary: Cambiar datos de un medicamento
      description: Actualización parcial. Para la baja lógica se usa `POST /medicamentos/{medicamento_id}/baja`.
      x-nivel-acceso: LECTURA_ESCRITURA
      security:
        - sesion: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicamentoActualizar'
            examples:
              concentracion:
                dataValue:
                  concentracion: 50 mg / 12.5 mg
      responses:
        '200':
          description: Medicamento actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medicamento'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/MedicamentoDuplicado'
        '422':
          $ref: '#/components/responses/ReglaNegocio'

  /medicamentos/{medicamento_id}/baja:
    parameters:
      - $ref: '#/components/parameters/MedicamentoId'
    post:
      tags: [Medicamentos]
      operationId: darDeBajaMedicamento
      x-alcance: V2
      summary: Baja lógica de un medicamento
      description: Marca el medicamento como inactivo. Se rechaza si alguna entidad tiene existencias mayores a 0.
      x-nivel-acceso: LECTURA_ESCRITURA
      security:
        - sesion: []
          csrf: []
      responses:
        '200':
          description: Medicamento dado de baja (`activo = false`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medicamento'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El medicamento tiene existencias o ya estaba dado de baja.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                conExistencias:
                  summary: POST /medicamentos/6/baja (Paracetamol)
                  dataValue:
                    type: https://hogar.example/errores/medicamento-con-existencias
                    title: El medicamento tiene existencias
                    status: 409
                    code: MEDICAMENTO_CON_EXISTENCIAS
                    detail: 'Paracetamol 500 mg tiene existencias en 2 entidades (Hogar: 80, Carmen Torres Vega: 14).'
                    instance: /api/v1/medicamentos/6/baja
                yaInactivo:
                  dataValue:
                    type: https://hogar.example/errores/estado-invalido
                    title: Estado inválido
                    status: 409
                    code: ESTADO_INVALIDO
                    detail: El medicamento 7 ya está dado de baja.
                    instance: /api/v1/medicamentos/7/baja

  /medicamentos/{medicamento_id}/reactivacion:
    parameters:
      - $ref: '#/components/parameters/MedicamentoId'
    post:
      tags: [Medicamentos]
      operationId: reactivarMedicamento
      x-alcance: V2
      summary: Reactivar un medicamento dado de baja
      description: Alternativa a duplicarlo; la unicidad incluye a los inactivos.
      x-nivel-acceso: LECTURA_ESCRITURA
      security:
        - sesion: []
          csrf: []
      responses:
        '200':
          description: Medicamento reactivado (`activo = true`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medicamento'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalido'

  # ------------------------------------------------------------------
  # 3. Entidades y residentes
  # ------------------------------------------------------------------
  /entidades:
    get:
      tags: [Entidades]
      operationId: listarEntidades
      x-alcance: V2
      summary: Listar el Hogar y los residentes
      description: Pensado para selectores de origen y destino. El Hogar siempre aparece primero.
      x-nivel-acceso: SOLO_LECTURA
      parameters:
        - name: tipo
          in: query
          schema:
            $ref: '#/components/schemas/TipoEntidad'
        - name: activa
          in: query
          description: '`true` excluye a los residentes egresados o fallecidos. El Hogar siempre está activo.'
          schema:
            type: boolean
      responses:
        '200':
          description: Entidades.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntidadResumen'
              examples:
                demo:
                  dataValue:
                    - { id: 1, tipo: HOGAR, nombre: Hogar Gerontológico Demo, activa: true }
                    - { id: 101, tipo: RESIDENTE, nombre: María Guadalupe Hernández López, activa: true }
                    - { id: 102, tipo: RESIDENTE, nombre: José Luis Ramírez Ortega, activa: true }
                    - { id: 103, tipo: RESIDENTE, nombre: Carmen Torres Vega, activa: true }
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /residentes:
