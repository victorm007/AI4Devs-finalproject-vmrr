      x-alcance: V2
      summary: Obtener un conteo con sus renglones y diferencias
      x-nivel-acceso: SOLO_LECTURA
      responses:
        '200':
          description: Conteo con renglones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conteo'
              examples:
                hogar:
                  summary: GET /conteos/2
                  dataValue:
                    id: 2
                    entidad: { id: 1, tipo: HOGAR, nombre: Hogar Gerontológico Demo, activa: true }
                    periodo_inicio: '2026-10-01'
                    periodo_fin: '2026-10-15'
                    estado: EN_PROCESO
                    usuario: { id: 2, username: operador.demo }
                    creado_en: '2026-10-15T18:00:00-06:00'
                    cerrado_en: null
                    nota: Conteo quincenal del botiquín del hogar. Faltan por contar Losartán y Tempra.
                    resumen: { renglones: 3, con_diferencia: 1, diferencia_total: -1 }
                    detalles:
                      - medicamento: { id: 5, nombre_comercial: Omeprazol, presentacion: cápsula, concentracion: 20 mg }
                        cantidad_fisica: 58
                        cantidad_sistema: 59
                        diferencia: -1
                      - medicamento: { id: 6, nombre_comercial: Paracetamol, presentacion: tableta, concentracion: 500 mg }
                        cantidad_fisica: 80
                        cantidad_sistema: 80
                        diferencia: 0
                      - medicamento: { id: 10, nombre_comercial: Aspirina Protect, presentacion: tableta, concentracion: 100 mg }
                        cantidad_fisica: 58
                        cantidad_sistema: 58
                        diferencia: 0
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /conteos/{conteo_id}/detalles/{medicamento_id}:
    parameters:
      - $ref: '#/components/parameters/ConteoId'
      - $ref: '#/components/parameters/MedicamentoId'
    put:
      tags: [Conteos]
      operationId: capturarRenglonConteo
      x-alcance: V2
      summary: Capturar o corregir la cantidad física de un medicamento
      description: |
        Idempotente: crea el renglón o reemplaza la cantidad física. En cada captura, el servidor toma la foto
        `cantidad_sistema` con el saldo registrado en ese momento, y la base de datos calcula `diferencia`.
        Se puede contar un medicamento sin existencia registrada (`cantidad_sistema = 0`).
      x-nivel-acceso: LECTURA_ESCRITURA
      security:
        - sesion: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetalleConteoCaptura'
            examples:
              losartan:
                summary: PUT /conteos/2/detalles/2
                dataValue:
                  cantidad_fisica: 20
      responses:
        '200':
          description: Renglón reemplazado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetalleConteo'
        '201':
          description: Renglón creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetalleConteo'
              examples:
                losartan:
                  dataValue:
                    medicamento: { id: 2, nombre_comercial: Losartán, presentacion: tableta, concentracion: 50 mg }
                    cantidad_fisica: 20
                    cantidad_sistema: 20
                    diferencia: 0
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConteoCerrado'
    delete:
      tags: [Conteos]
      operationId: eliminarRenglonConteo
      x-alcance: V2
      summary: Quitar un renglón de un conteo en proceso
      x-nivel-acceso: LECTURA_ESCRITURA
      security:
        - sesion: []
          csrf: []
      responses:
        '204':
          description: Renglón eliminado.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConteoCerrado'

  /conteos/{conteo_id}/cierre:
    parameters:
      - $ref: '#/components/parameters/ConteoId'
    post:
      tags: [Conteos]
      operationId: cerrarConteo
      x-alcance: V2
      summary: Cerrar un conteo
      description: |
        Pasa el conteo a `CERRADO`; a partir de ahí es inmutable. El cierre **no ajusta existencias**:
        las diferencias se resuelven registrando movimientos (por ejemplo, una baja por `MERMA`).
      x-nivel-acceso: LECTURA_ESCRITURA
      security:
        - sesion: []
          csrf: []
      responses:
        '200':
          description: Conteo cerrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conteo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConteoCerrado'
        '422':
          description: El conteo no tiene renglones.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                vacio:
                  dataValue:
                    type: https://hogar.example/errores/conteo-sin-renglones
                    title: Conteo sin renglones
                    status: 422
                    code: CONTEO_SIN_RENGLONES
                    detail: Capture al menos un medicamento antes de cerrar el conteo 3.
                    instance: /api/v1/conteos/3/cierre

  # ------------------------------------------------------------------
  # 7. Reporte mensual
  # ------------------------------------------------------------------
  /reportes/mensual:
    get:
      tags: [Reportes]
      operationId: obtenerReporteMensual
      x-alcance: MVP
      summary: Movimientos y saldos de un mes
      description: |
        Por entidad y medicamento: saldo al inicio del mes, entradas, transferencias recibidas y enviadas,
        bajas (total y por motivo) y saldo al cierre. Se calcula al momento a partir de `movimiento`;
        un mes en curso muestra el saldo a la fecha.
      x-nivel-acceso: SOLO_LECTURA
      parameters:
        - name: anio
          in: query
          required: true
          schema:
            type: integer
            minimum: 2020
            maximum: 2100
          example: 2026
        - name: mes
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
          example: 9
        - name: entidad_id
          in: query
          description: Si se omite, incluye todas las entidades con movimientos o saldo en el mes.
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Reporte del mes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteMensual'
              examples:
                mariaSeptiembre:
                  summary: GET /reportes/mensual?anio=2026&mes=9&entidad_id=101
                  dataValue:
                    anio: 2026
                    mes: 9
                    desde: '2026-09-01'
                    hasta: '2026-09-30'
                    generado_en: '2026-10-19T09:00:00-06:00'
                    entidades:
                      - entidad: { id: 101, tipo: RESIDENTE, nombre: María Guadalupe Hernández López, activa: true }
                        medicamentos:
                          - medicamento: { id: 9, nombre_comercial: Atorvastatina, presentacion: tableta, concentracion: 20 mg }
                            saldo_inicial: 0
                            entradas: 30
                            transferencias_recibidas: 0
                            transferencias_enviadas: 0
                            bajas: 29
                            bajas_por_motivo: { CONSUMO: 29 }
                            saldo_final: 1
                          - medicamento: { id: 1, nombre_comercial: Metformina, presentacion: tableta, concentracion: 850 mg }
                            saldo_inicial: 0
                            entradas: 60
                            transferencias_recibidas: 0
                            transferencias_enviadas: 0
                            bajas: 58
                            bajas_por_motivo: { CONSUMO: 58 }
                            saldo_final: 2
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

components:
  securitySchemes:
    sesion:
      type: apiKey
      in: cookie
      name: sessionid
      description: Cookie de sesión de Django, emitida por `POST /auth/login`.
    csrf:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: Valor de la cookie `csrftoken`. Obligatorio en `POST`, `PUT`, `PATCH` y `DELETE`.

  headers:
    Location:
      description: URL del recurso creado.
      schema:
        type: string
        format: uri-reference
      example: /api/v1/medicamentos/16

  parameters:
    Pagina:
      name: pagina
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PorPagina:
      name: por_pagina
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Busqueda:
      name: q
      in: query
      description: Texto a buscar; sin distinguir mayúsculas ni acentos.
      schema:
        type: string
        minLength: 3
        maxLength: 100
      example: losartan
    Desde:
      name: desde
      in: query
      description: Fecha inicial inclusiva.
      schema:
        type: string
        format: date
      example: '2026-09-01'
    Hasta:
      name: hasta
      in: query
      description: Fecha final inclusiva. Debe ser mayor o igual a `desde`.
      schema:
        type: string
        format: date
      example: '2026-09-30'
    MedicamentoId:
      name: medicamento_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: 6
    ResidenteId:
      name: residente_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: 103
    MovimientoId:
      name: movimiento_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: 28
    ConteoId:
      name: conteo_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: 2
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Opcional y recomendado desde el celular. Si la misma clave se reenvía en las siguientes 24 h con el mismo
        cuerpo, el servidor responde el mismo `201` sin registrar un movimiento duplicado. Con otro cuerpo responde
        `409 IDEMPOTENCIA_CONFLICTO`.
      schema:
        type: string
        minLength: 8
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]+$'
      example: 3f6c2a9e-7d41-4b8a-9f0e-2c5d8b1a4e77

  responses:
    Validacion:
      description: La petición no cumple el esquema o las validaciones de campos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            campos:
              summary: POST /residentes con apellido vacío y fecha de ingreso anterior al nacimiento
              dataValue:
                type: https://hogar.example/errores/validacion
                title: Datos inválidos
                status: 400
                code: VALIDACION
                detail: La petición tiene 2 errores de validación.
                instance: /api/v1/residentes
                errores:
                  - { campo: primer_apellido, codigo: CAMPO_VACIO, mensaje: El primer apellido es obligatorio. }
                  - { campo: fecha_ingreso, codigo: FECHA_INVALIDA, mensaje: La fecha de ingreso no puede ser anterior a la fecha de nacimiento. }
            desconocido:
              dataValue:
                type: https://hogar.example/errores/validacion
                title: Datos inválidos
                status: 400
                code: VALIDACION
                detail: La petición tiene 1 error de validación.
                instance: /api/v1/movimientos/entradas
                errores:
                  - { campo: saldo, codigo: CAMPO_DESCONOCIDO, mensaje: El campo "saldo" no está permitido. }
    NoAutenticado:
      description: Falta la sesión o expiró.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            sinSesion:
              dataValue:
                type: https://hogar.example/errores/no-autenticado
                title: No autenticado
                status: 401
                code: NO_AUTENTICADO
                detail: Inicie sesión para continuar.
                instance: /api/v1/existencias
    SinPermiso:
      description: El usuario no tiene el nivel de acceso requerido, o falta o es inválido el token CSRF.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            soloLectura:
              summary: consulta.demo intenta registrar una baja
              dataValue:
                type: https://hogar.example/errores/sin-permiso
                title: Sin permiso
                status: 403
                code: SIN_PERMISO
                detail: Su nivel de acceso (Solo lectura) no permite registrar movimientos.
                instance: /api/v1/movimientos/bajas
            csrf:
              dataValue:
                type: https://hogar.example/errores/csrf-invalido
                title: Token CSRF inválido
                status: 403
                code: CSRF_INVALIDO
                detail: Falta la cabecera X-CSRFToken o no coincide con la cookie csrftoken.
                instance: /api/v1/movimientos/bajas
    CsrfInvalido:
      description: Falta o es inválido el token CSRF.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            csrf:
              dataValue:
                type: https://hogar.example/errores/csrf-invalido
                title: Token CSRF inválido
                status: 403
                code: CSRF_INVALIDO
                detail: Falta la cabecera X-CSRFToken o no coincide con la cookie csrftoken.
                instance: /api/v1/auth/login
    NoEncontrado:
      description: El recurso no existe.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            medicamento:
              dataValue:
                type: https://hogar.example/errores/no-encontrado
                title: No encontrado
                status: 404
                code: NO_ENCONTRADO
                detail: No existe el medicamento 999.
                instance: /api/v1/medicamentos/999
    EstadoInvalido:
      description: La operación no es válida en el estado actual del recurso.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            egresado:
              dataValue:
                type: https://hogar.example/errores/estado-invalido
                title: Estado inválido
                status: 409
                code: ESTADO_INVALIDO
                detail: El residente 102 ya tiene estado EGRESADO.
                instance: /api/v1/residentes/102/egreso
    MedicamentoDuplicado:
      description: Ya existe un medicamento con el mismo nombre comercial, presentación y concentración (sin distinguir mayúsculas ni acentos).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            losartan:
              dataValue:
                type: https://hogar.example/errores/medicamento-duplicado
                title: Medicamento duplicado
                status: 409
                code: MEDICAMENTO_DUPLICADO
                detail: Ya existe "Losartán 50 mg" en tableta (medicamento 2).
                instance: /api/v1/medicamentos
    ConteoCerrado:
      description: El conteo está cerrado y no se puede modificar.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            cerrado:
              summary: PUT /conteos/1/detalles/6
              dataValue:
                type: https://hogar.example/errores/conteo-cerrado
                title: Conteo cerrado
                status: 409
                code: CONTEO_CERRADO
                detail: El conteo 1 se cerró el 2026-09-30 a las 21:30 y ya no se puede modificar.
                instance: /api/v1/conteos/1/detalles/6
    IdempotenciaConflicto:
      description: La clave de idempotencia ya se usó con un cuerpo distinto.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            conflicto:
              dataValue:
                type: https://hogar.example/errores/idempotencia-conflicto
                title: Clave de idempotencia reutilizada
                status: 409
                code: IDEMPOTENCIA_CONFLICTO
                detail: La clave 3f6c2a9e-7d41-4b8a-9f0e-2c5d8b1a4e77 ya se usó con otros datos.
                instance: /api/v1/movimientos/entradas
    ReglaNegocio:
      description: La petición es válida, pero viola una regla de negocio.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            existenciaInsuficiente:
              summary: Transferir 100 dosis cuando el Hogar tiene 80
              dataValue:
                type: https://hogar.example/errores/existencia-insuficiente
                title: Existencia insuficiente
                status: 422
                code: EXISTENCIA_INSUFICIENTE
                detail: El Hogar tiene 80 dosis de Paracetamol 500 mg; se intentó retirar 100.
                instance: /api/v1/movimientos/transferencias
                disponible: 80
                solicitado: 100
            entidadInactiva:
              dataValue:
                type: https://hogar.example/errores/entidad-inactiva
                title: Entidad inactiva
                status: 422
                code: ENTIDAD_INACTIVA
                detail: José Luis Ramírez Ortega tiene estado EGRESADO y no puede recibir medicamentos.
                instance: /api/v1/movimientos/transferencias
            medicamentoInactivo:
              dataValue:
                type: https://hogar.example/errores/medicamento-inactivo
                title: Medicamento dado de baja
                status: 422
                code: MEDICAMENTO_INACTIVO
                detail: Tempra está dado de baja; reactívelo antes de registrar entradas.
                instance: /api/v1/movimientos/entradas
            mismaEntidad:
              dataValue:
                type: https://hogar.example/errores/misma-entidad
                title: Origen y destino iguales
                status: 422
                code: MISMA_ENTIDAD
                detail: El origen y el destino de una transferencia deben ser distintos.
                instance: /api/v1/movimientos/transferencias
            motivoReservado:
              dataValue:
                type: https://hogar.example/errores/motivo-reservado
                title: Motivo reservado
                status: 422
                code: MOTIVO_RESERVADO
                detail: El motivo CORRECCION solo se usa desde POST /movimientos/{id}/correccion.
                instance: /api/v1/movimientos/bajas
            referenciaInvalida:
              dataValue:
                type: https://hogar.example/errores/referencia-invalida
                title: Referencia inválida
                status: 422
                code: REFERENCIA_INVALIDA
                detail: No existe la entidad 999.
                instance: /api/v1/movimientos/entradas
    DemasiadosIntentos:
      description: Cuenta bloqueada temporalmente tras 5 intentos fallidos (django-axes).
      headers:
        Retry-After:
          description: Segundos hasta poder reintentar.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            bloqueo:
              dataValue:
                type: https://hogar.example/errores/demasiados-intentos
                title: Demasiados intentos
                status: 429
                code: DEMASIADOS_INTENTOS
                detail: La cuenta está bloqueada durante 15 minutos por intentos fallidos.
                instance: /api/v1/auth/login
    ErrorInterno:
      description: Error inesperado del servidor. El detalle no expone información interna.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            interno:
              dataValue:
                type: https://hogar.example/errores/error-interno
                title: Error interno
                status: 500
                code: ERROR_INTERNO
                detail: Ocurrió un error inesperado. Referencia 7c1e2d.
                instance: /api/v1/movimientos/transferencias
    MovimientoRegistrado:
      description: Movimiento registrado, con los saldos resultantes de las entidades afectadas.
      headers:
        Location:
          $ref: '#/components/headers/Location'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MovimientoRegistrado'
          examples:
            transferencia:
              summary: Transferencia de 10 dosis de Paracetamol del Hogar a Carmen
              dataValue:
                movimiento:
                  id: 29
                  tipo: TRANSFERENCIA
                  medicamento: { id: 6, nombre_comercial: Paracetamol, presentacion: tableta, concentracion: 500 mg }
                  cantidad: 10
                  entidad_origen: { id: 1, tipo: HOGAR, nombre: Hogar Gerontológico Demo, activa: true }
                  entidad_destino: { id: 103, tipo: RESIDENTE, nombre: Carmen Torres Vega, activa: true }
                  motivo_baja: null
                  origen_entrada: null
                  entregado_por: null
                  corrige_a_id: null
                  corregido_por_id: null
                  nota: Reposición para su pauta en caso necesario
                  usuario: { id: 2, username: operador.demo }
                  fecha_hora: '2026-10-19T09:30:00-06:00'
                saldos:
                  - { entidad_id: 1, medicamento_id: 6, saldo: 70 }
                  - { entidad_id: 103, medicamento_id: 6, saldo: 24 }
            correccion:
              summary: Corrección de la baja por rotura 28 (genera una entrada)
              dataValue:
                movimiento:
                  id: 30
                  tipo: ENTRADA
                  medicamento: { id: 5, nombre_comercial: Omeprazol, presentacion: cápsula, concentracion: 20 mg }
                  cantidad: 1
                  entidad_origen: null
                  entidad_destino: { id: 1, tipo: HOGAR, nombre: Hogar Gerontológico Demo, activa: true }
                  motivo_baja: null
                  origen_entrada: null
                  entregado_por: null
                  corrige_a_id: 28
                  corregido_por_id: null
                  nota: La cápsula no estaba rota; se registró por error
                  usuario: { id: 2, username: operador.demo }
                  fecha_hora: '2026-10-19T09:40:00-06:00'
                saldos:
                  - { entidad_id: 1, medicamento_id: 5, saldo: 60 }

  schemas:
    # ---------------- Tipos base ----------------
    Id:
      type: integer
      format: int64
      minimum: 1
    Cantidad:
      description: Dosis, con hasta 2 decimales.
      type: number
      exclusiveMinimum: 0
      maximum: 99999999.99
      multipleOf: 0.01
    Saldo:
      description: Dosis disponibles (nunca negativo).
      type: number
      minimum: 0
      maximum: 99999999.99
    Diferencia:
      description: Cantidad física menos cantidad del sistema.
      type: number
    TextoObligatorio:
      type: string
      minLength: 1
      pattern: '\S'
    Nota:
      type: [string, 'null']
      maxLength: 1000
    FechaHora:
      type: string
      format: date-time
    TipoMedicamento:
      type: string
      enum: [GENERICO, ORIGINAL]
    TipoEntidad:
      type: string
      enum: [HOGAR, RESIDENTE]
    EstadoResidente:
      type: string
      enum: [ACTIVO, EGRESADO, FALLECIDO]
    TipoMovimiento:
      type: string
      enum: [ENTRADA, TRANSFERENCIA, BAJA]
    OrigenEntrada:
      type: string
      enum: [FAMILIAR, HOGAR, OTRO]
    EstadoConteo:
      type: string
      enum: [EN_PROCESO, CERRADO]
    NivelAcceso:
      type: string
      enum: [SOLO_LECTURA, LECTURA_ESCRITURA, ADMINISTRADOR]

    # ---------------- Errores (RFC 9457) ----------------
    CodigoError:
      type: string
      enum:
        - VALIDACION
        - NO_AUTENTICADO
        - CREDENCIALES_INVALIDAS
        - SIN_PERMISO
        - CSRF_INVALIDO
        - NO_ENCONTRADO
        - METODO_NO_PERMITIDO
        - ESTADO_INVALIDO
        - MEDICAMENTO_DUPLICADO
        - PRINCIPIO_ACTIVO_DUPLICADO
        - MEDICAMENTO_CON_EXISTENCIAS
        - MOVIMIENTO_YA_CORREGIDO
        - MOVIMIENTO_ES_CORRECCION
        - CONTEO_CERRADO
        - IDEMPOTENCIA_CONFLICTO
        - EXISTENCIA_INSUFICIENTE
        - ENTIDAD_INACTIVA
        - MEDICAMENTO_INACTIVO
        - MISMA_ENTIDAD
        - MOTIVO_RESERVADO
        - REFERENCIA_INVALIDA
        - CONTEO_SIN_RENGLONES
        - DEMASIADOS_INTENTOS
        - ERROR_INTERNO
    ErrorCampo:
      type: object
      additionalProperties: false
      required: [campo, codigo, mensaje]
      properties:
        campo:
          description: Ruta del campo (`cantidad`, `principios_activos_ids[0]`) o `non_field_errors`.
          type: string
        codigo:
          type: string
          enum: [CAMPO_REQUERIDO, CAMPO_VACIO, CAMPO_DESCONOCIDO, TIPO_INVALIDO, FORMATO_INVALIDO,
                 VALOR_FUERA_DE_RANGO, LONGITUD_INVALIDA, OPCION_INVALIDA, FECHA_INVALIDA,
                 PERIODO_INVALIDO, REFERENCIA_INVALIDA]
        mensaje:
          type: string
    Problema:
      description: Problem Details (RFC 9457) con extensiones de la aplicación.
      type: object
      required: [type, title, status, code, detail]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          $ref: '#/components/schemas/CodigoError'
        errores:
          description: Solo en `VALIDACION` y `REFERENCIA_INVALIDA`.
          type: array
          items:
            $ref: '#/components/schemas/ErrorCampo'
        disponible:
          description: Solo en `EXISTENCIA_INSUFICIENTE`.
          $ref: '#/components/schemas/Saldo'
        solicitado:
          description: Solo en `EXISTENCIA_INSUFICIENTE`.
          $ref: '#/components/schemas/Cantidad'

    # ---------------- Paginación ----------------
    Pagina:
      type: object
      required: [total, pagina, por_pagina, resultados]
      properties:
        total:
          type: integer
          minimum: 0
        pagina:
          type: integer
          minimum: 1
        por_pagina:
          type: integer
          minimum: 1
          maximum: 100
        resultados:
          type: array
    PaginaPrincipiosActivos:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            resultados:
              type: array
              items:
                $ref: '#/components/schemas/PrincipioActivo'
    PaginaMedicamentos:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            resultados:
              type: array
              items:
                $ref: '#/components/schemas/Medicamento'
    PaginaResidentes:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            resultados:
              type: array
              items:
                $ref: '#/components/schemas/Residente'
    PaginaMovimientos:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            resultados:
              type: array
              items:
                $ref: '#/components/schemas/Movimiento'
    PaginaExistencias:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            resultados:
              type: array
              items:
                $ref: '#/components/schemas/Existencia'
    PaginaConteos:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            resultados:
              type: array
              items:
                $ref: '#/components/schemas/ConteoResumen'

    # ---------------- Autenticación ----------------
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    UsuarioActual:
      type: object
      required: [id, username, nombre, nivel_acceso]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          type: string
        nombre:
          type: string
        nivel_acceso:
          $ref: '#/components/schemas/NivelAcceso'
    UsuarioResumen:
      type: object
      required: [id, username]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          type: string

    # ---------------- Catálogos ----------------
    Presentacion:
      type: object
      required: [id, nombre]
      properties:
        id:
          type: integer
          minimum: 1
        nombre:
          type: string
    MotivoBaja:
      type: object
      required: [id, clave, descripcion]
      properties:
        id:
          type: integer
          minimum: 1
        clave:
          type: string
          maxLength: 30
        descripcion:
          type: string
    PrincipioActivo:
      type: object
      required: [id, nombre]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nombre:
          type: string
    PrincipioActivoCrear:
      type: object
      additionalProperties: false
      required: [nombre]
      properties:
        nombre:
          allOf:
            - $ref: '#/components/schemas/TextoObligatorio'
          maxLength: 150

    # ---------------- Medicamentos ----------------
    Medicamento:
      type: object
      required: [id, nombre_comercial, tipo, presentacion, concentracion, principios_activos, activo, creado_en, actualizado_en]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nombre_comercial:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoMedicamento'
        presentacion:
          $ref: '#/components/schemas/Presentacion'
        concentracion:
          type: string
        principios_activos:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PrincipioActivo'
        activo:
          type: boolean
        creado_en:
          $ref: '#/components/schemas/FechaHora'
        actualizado_en:
          $ref: '#/components/schemas/FechaHora'
    MedicamentoResumen:
      type: object
      required: [id, nombre_comercial, presentacion, concentracion]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nombre_comercial:
          type: string
        presentacion:
          description: Nombre de la presentación.
          type: string
        concentracion:
          type: string
    MedicamentoCrear:
      type: object
      additionalProperties: false
      required: [nombre_comercial, tipo, presentacion_id, concentracion, principios_activos_ids]
      properties:
        nombre_comercial:
          allOf:
            - $ref: '#/components/schemas/TextoObligatorio'
          maxLength: 150
        tipo:
          $ref: '#/components/schemas/TipoMedicamento'
        presentacion_id:
          type: integer
          minimum: 1
        concentracion:
          allOf:
            - $ref: '#/components/schemas/TextoObligatorio'
          maxLength: 60
        principios_activos_ids:
          description: |
            Al menos uno. Un valor que no es array (incluido `null`) responde `400 VALIDACION` con
            `TIPO_INVALIDO`; la lista vacía (`minItems`) responde `400 VALIDACION` con
            `errores[] = { campo: principios_activos_ids, codigo: CAMPO_VACIO,
            mensaje: "Un medicamento debe tener al menos un principio activo." }`, el mismo mensaje de la
            regla del formulario del panel (`exigir_principio_activo()` de `apps/catalogo/validadores.py`).
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Id'
    MedicamentoActualizar:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nombre_comercial:
          allOf:
            - $ref: '#/components/schemas/TextoObligatorio'
          maxLength: 150
        tipo:
          $ref: '#/components/schemas/TipoMedicamento'
        presentacion_id:
          type: integer
          minimum: 1
        concentracion:
          allOf:
            - $ref: '#/components/schemas/TextoObligatorio'
          maxLength: 60
        principios_activos_ids:
          description: |
            Al menos uno. Un valor que no es array (incluido `null`) responde `400 VALIDACION` con
            `TIPO_INVALIDO`; la lista vacía (`minItems`) responde `400 VALIDACION` con
            `errores[] = { campo: principios_activos_ids, codigo: CAMPO_VACIO,
            mensaje: "Un medicamento debe tener al menos un principio activo." }`, el mismo mensaje de la
            regla del formulario del panel (`exigir_principio_activo()` de `apps/catalogo/validadores.py`).
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Id'

    # ---------------- Entidades y residentes ----------------
    EntidadResumen:
      type: object
      required: [id, tipo, nombre, activa]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        tipo:
          $ref: '#/components/schemas/TipoEntidad'
        nombre:
          description: Nombre del Hogar o nombre completo del residente (calculado).
          type: string
        activa:
          type: boolean
    Residente:
      type: object
      required: [id, primer_nombre, segundo_nombre, primer_apellido, segundo_apellido, nombre_completo,
                 fecha_nacimiento, fecha_ingreso, estado, fecha_baja]
      properties:
        id:
          description: Id del residente, igual al de su entidad.
          $ref: '#/components/schemas/Id'
        primer_nombre:
          type: string
        segundo_nombre:
          type: [string, 'null']
        primer_apellido:
          type: string
        segundo_apellido:
          type: [string, 'null']
        nombre_completo:
          type: string
          readOnly: true
        fecha_nacimiento:
          type: string
          format: date
        fecha_ingreso:
          type: string
          format: date
        estado:
          $ref: '#/components/schemas/EstadoResidente'
        fecha_baja:
          type: [string, 'null']
          format: date
    ResidenteCrear:
      description: 'Validaciones adicionales del servidor: `fecha_nacimiento` ≥ 1900-01-01 y no futura; `fecha_ingreso` ≥ `fecha_nacimiento`.'
      type: object
      additionalProperties: false
      required: [primer_nombre, primer_apellido, fecha_nacimiento, fecha_ingreso]
      properties:
        primer_nombre:
          allOf:
            - $ref: '#/components/schemas/TextoObligatorio'
          maxLength: 60
        segundo_nombre:
          type: [string, 'null']
          maxLength: 60
        primer_apellido:
          allOf:
            - $ref: '#/components/schemas/TextoObligatorio'
          maxLength: 60
        segundo_apellido:
          type: [string, 'null']
          maxLength: 60
        fecha_nacimiento:
          type: string
          format: date
        fecha_ingreso:
          type: string
          format: date
    ResidenteActualizar:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        primer_nombre:
          allOf:
            - $ref: '#/components/schemas/TextoObligatorio'
          maxLength: 60
        segundo_nombre:
          type: [string, 'null']
          maxLength: 60
        primer_apellido:
          allOf:
            - $ref: '#/components/schemas/TextoObligatorio'
          maxLength: 60
        segundo_apellido:
          type: [string, 'null']
          maxLength: 60
        fecha_nacimiento:
          type: string
          format: date
        fecha_ingreso:
          type: string
          format: date
    EgresoRequest:
      description: '`fecha_baja` debe ser ≥ `fecha_ingreso` y no futura.'
      type: object
      additionalProperties: false
      required: [estado, fecha_baja]
      properties:
        estado:
          type: string
          enum: [EGRESADO, FALLECIDO]
        fecha_baja:
          type: string
          format: date
    EgresoRespuesta:
      type: object
      required: [residente, existencias_pendientes]
      properties:
        residente:
          $ref: '#/components/schemas/Residente'
        existencias_pendientes:
          type: array
          items:
            $ref: '#/components/schemas/Existencia'

    # ---------------- Existencias ----------------
    Existencia:
      type: object
      required: [entidad, medicamento, saldo, actualizado_en]
      properties:
        entidad:
          $ref: '#/components/schemas/EntidadResumen'
        medicamento:
          $ref: '#/components/schemas/MedicamentoResumen'
        saldo:
          $ref: '#/components/schemas/Saldo'
        actualizado_en:
          $ref: '#/components/schemas/FechaHora'
    SaldoResultante:
      type: object
      required: [entidad_id, medicamento_id, saldo]
      properties:
        entidad_id:
          $ref: '#/components/schemas/Id'
        medicamento_id:
          $ref: '#/components/schemas/Id'
        saldo:
          $ref: '#/components/schemas/Saldo'

    # ---------------- Movimientos ----------------
    Movimiento:
      type: object
      required: [id, tipo, medicamento, cantidad, entidad_origen, entidad_destino, motivo_baja, origen_entrada,
                 entregado_por, corrige_a_id, corregido_por_id, nota, usuario, fecha_hora]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        tipo:
          $ref: '#/components/schemas/TipoMovimiento'
        medicamento:
          $ref: '#/components/schemas/MedicamentoResumen'
        cantidad:
          $ref: '#/components/schemas/Cantidad'
        entidad_origen:
          oneOf:
            - $ref: '#/components/schemas/EntidadResumen'
            - type: 'null'
        entidad_destino:
          oneOf:
            - $ref: '#/components/schemas/EntidadResumen'
            - type: 'null'
        motivo_baja:
          oneOf:
            - $ref: '#/components/schemas/MotivoBaja'
            - type: 'null'
        origen_entrada:
          oneOf:
            - $ref: '#/components/schemas/OrigenEntrada'
            - type: 'null'
        entregado_por:
          type: [string, 'null']
        corrige_a_id:
          description: Movimiento que este corrige.
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        corregido_por_id:
          description: Movimiento que corrigió a este (calculado).
          readOnly: true
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        nota:
          $ref: '#/components/schemas/Nota'
        usuario:
          $ref: '#/components/schemas/UsuarioResumen'
        fecha_hora:
          $ref: '#/components/schemas/FechaHora'
    MovimientoRegistrado:
      type: object
      required: [movimiento, saldos]
      properties:
        movimiento:
          $ref: '#/components/schemas/Movimiento'
        saldos:
          description: Saldo resultante de cada entidad afectada.
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/SaldoResultante'
    EntradaCrear:
      type: object
      additionalProperties: false
      required: [entidad_destino_id, medicamento_id, cantidad, origen_entrada, entregado_por]
      properties:
        entidad_destino_id:
          $ref: '#/components/schemas/Id'
        medicamento_id:
          $ref: '#/components/schemas/Id'
        cantidad:
          $ref: '#/components/schemas/Cantidad'
        origen_entrada:
          $ref: '#/components/schemas/OrigenEntrada'
        entregado_por:
          allOf:
            - $ref: '#/components/schemas/TextoObligatorio'
          maxLength: 150
        nota:
          $ref: '#/components/schemas/Nota'
    TransferenciaCrear:
      description: '`entidad_origen_id` y `entidad_destino_id` deben ser distintos (`422 MISMA_ENTIDAD`).'
      type: object
      additionalProperties: false
      required: [entidad_origen_id, entidad_destino_id, medicamento_id, cantidad]
      properties:
        entidad_origen_id:
          $ref: '#/components/schemas/Id'
        entidad_destino_id:
          $ref: '#/components/schemas/Id'
        medicamento_id:
          $ref: '#/components/schemas/Id'
        cantidad:
          $ref: '#/components/schemas/Cantidad'
        nota:
          $ref: '#/components/schemas/Nota'
    BajaCrear:
      type: object
      additionalProperties: false
      required: [entidad_origen_id, medicamento_id, cantidad, motivo_baja]
      properties:
        entidad_origen_id:
          $ref: '#/components/schemas/Id'
        medicamento_id:
          $ref: '#/components/schemas/Id'
        cantidad:
          $ref: '#/components/schemas/Cantidad'
        motivo_baja:
          description: Clave de un motivo activo de `GET /motivos-baja`, excepto `CORRECCION`.
          type: string
          maxLength: 30
          examples: [CONSUMO]
        nota:
          $ref: '#/components/schemas/Nota'
    CorreccionCrear:
      type: object
      additionalProperties: false
      required: [nota]
      properties:
        nota:
          description: Motivo de la corrección (obligatorio, queda en el historial).
          allOf:
            - $ref: '#/components/schemas/TextoObligatorio'
          maxLength: 1000

    # ---------------- Conteos ----------------
    ResumenConteo:
      type: object
      required: [renglones, con_diferencia, diferencia_total]
      properties:
        renglones:
          type: integer
          minimum: 0
        con_diferencia:
          type: integer
          minimum: 0
        diferencia_total:
          $ref: '#/components/schemas/Diferencia'
    ConteoResumen:
      type: object
      required: [id, entidad, periodo_inicio, periodo_fin, estado, usuario, creado_en, cerrado_en, nota, resumen]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        entidad:
          $ref: '#/components/schemas/EntidadResumen'
        periodo_inicio:
          type: string
          format: date
        periodo_fin:
          type: string
          format: date
        estado:
          $ref: '#/components/schemas/EstadoConteo'
        usuario:
          $ref: '#/components/schemas/UsuarioResumen'
        creado_en:
          $ref: '#/components/schemas/FechaHora'
        cerrado_en:
          type: [string, 'null']
          format: date-time
        nota:
          $ref: '#/components/schemas/Nota'
        resumen:
          $ref: '#/components/schemas/ResumenConteo'
    Conteo:
      allOf:
        - $ref: '#/components/schemas/ConteoResumen'
        - type: object
          required: [detalles]
          properties:
            detalles:
              type: array
              items:
                $ref: '#/components/schemas/DetalleConteo'
    ConteoCrear:
      description: '`periodo_fin` debe ser ≥ `periodo_inicio` (`400 PERIODO_INVALIDO`).'
      type: object
      additionalProperties: false
      required: [entidad_id, periodo_inicio, periodo_fin]
      properties:
        entidad_id:
          $ref: '#/components/schemas/Id'
        periodo_inicio:
          type: string
          format: date
        periodo_fin:
          type: string
          format: date
        nota:
          $ref: '#/components/schemas/Nota'
    DetalleConteo:
      type: object
      required: [medicamento, cantidad_fisica, cantidad_sistema, diferencia]
      properties:
        medicamento:
          $ref: '#/components/schemas/MedicamentoResumen'
        cantidad_fisica:
          $ref: '#/components/schemas/Saldo'
        cantidad_sistema:
          description: Foto del saldo registrado al capturar el renglón.
          $ref: '#/components/schemas/Saldo'
        diferencia:
          $ref: '#/components/schemas/Diferencia'
    DetalleConteoCaptura:
      type: object
      additionalProperties: false
      required: [cantidad_fisica]
      properties:
        cantidad_fisica:
          type: number
          minimum: 0
          maximum: 99999999.99
          multipleOf: 0.01

    # ---------------- Reporte mensual ----------------
    LineaReporte:
      description: 'Invariante: `saldo_final = saldo_inicial + entradas + transferencias_recibidas - transferencias_enviadas - bajas`.'
      type: object
      required: [medicamento, saldo_inicial, entradas, transferencias_recibidas, transferencias_enviadas, bajas,
                 bajas_por_motivo, saldo_final]
      properties:
        medicamento:
          $ref: '#/components/schemas/MedicamentoResumen'
        saldo_inicial:
          $ref: '#/components/schemas/Saldo'
        entradas:
          $ref: '#/components/schemas/Saldo'
        transferencias_recibidas:
          $ref: '#/components/schemas/Saldo'
        transferencias_enviadas:
          $ref: '#/components/schemas/Saldo'
        bajas:
          $ref: '#/components/schemas/Saldo'
        bajas_por_motivo:
          description: Dosis dadas de baja por clave de motivo.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Saldo'
        saldo_final:
          $ref: '#/components/schemas/Saldo'
    ReporteMensual:
      type: object
      required: [anio, mes, desde, hasta, generado_en, entidades]
      properties:
        anio:
          type: integer
        mes:
          type: integer
          minimum: 1
          maximum: 12
        desde:
          type: string
          format: date
        hasta:
          type: string
          format: date
        generado_en:
          $ref: '#/components/schemas/FechaHora'
        entidades:
          type: array
          items:
            type: object
            required: [entidad, medicamentos]
            properties:
              entidad:
                $ref: '#/components/schemas/EntidadResumen'
              medicamentos:
                type: array
                items:
                  $ref: '#/components/schemas/LineaReporte'
