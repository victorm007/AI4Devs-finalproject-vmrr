  /movimientos/{movimiento_id}/correccion:
    parameters:
      - $ref: '#/components/parameters/MovimientoId'
    post:
      tags: [Movimientos]
      operationId: corregirMovimiento
      x-alcance: V2
      summary: Corregir un movimiento con su inverso
      description: |
        El servidor genera el movimiento inverso y lo enlaza con `corrige_a_id`:
        - Una entrada se corrige con una baja de motivo `CORRECCION`.
        - Una baja se corrige con una entrada.
        - Una transferencia se corrige con la transferencia en sentido contrario.

        Cada movimiento se corrige una sola vez, y una corrección no se corrige: se registra el movimiento correcto.
      x-nivel-acceso: LECTURA_ESCRITURA
      security:
        - sesion: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorreccionCrear'
            examples:
              rotura:
                summary: POST /movimientos/28/correccion
                dataValue:
                  nota: La cápsula no estaba rota; se registró por error
      responses:
        '201':
          $ref: '#/components/responses/MovimientoRegistrado'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El movimiento ya fue corregido, es en sí una corrección, o la clave de idempotencia se reutilizó.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                yaCorregido:
                  summary: POST /movimientos/22/correccion
                  dataValue:
                    type: https://hogar.example/errores/movimiento-ya-corregido
                    title: Movimiento ya corregido
                    status: 409
                    code: MOVIMIENTO_YA_CORREGIDO
                    detail: El movimiento 22 ya fue corregido por el movimiento 23.
                    instance: /api/v1/movimientos/22/correccion
                esCorreccion:
                  summary: POST /movimientos/23/correccion
                  dataValue:
                    type: https://hogar.example/errores/movimiento-es-correccion
                    title: No se puede corregir una corrección
                    status: 409
                    code: MOVIMIENTO_ES_CORRECCION
                    detail: El movimiento 23 es la corrección del 22; registre el movimiento correcto en su lugar.
                    instance: /api/v1/movimientos/23/correccion
        '422':
          $ref: '#/components/responses/ReglaNegocio'

