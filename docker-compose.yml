# Servicios del sistema (readme, sección 2.4.1).
# HB-01 crea db; HB-02 agrega web y HB-04 agrega nginx, el único que publica puertos.
name: hogar

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      # Las lee db/init/01_roles.sh para crear los 2 usuarios de la aplicación
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?Falta DB_OWNER_PASSWORD en .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Falta DB_APP_PASSWORD en .env}
      DB_OWNER_CREATEDB: ${DB_OWNER_CREATEDB:-false}
    volumes:
      - pgdata:/var/lib/postgresql/data          # datos persistentes
      - ./db/init:/docker-entrypoint-initdb.d:ro # scripts de inicio, solo lectura
    healthcheck:
      # Por TCP: el servidor temporal de la inicialización solo atiende por socket
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]
    # Sin "ports": PostgreSQL no se publica al host (readme, sección 2.5, aislamiento de red)

  web:
    build:
      context: ./app
      args:
        INSTALAR_DEV: ${INSTALAR_DEV:-false}
        APP_UID: ${APP_UID:-1000}
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.prod}
      SECRET_KEY: ${SECRET_KEY:?Falta SECRET_KEY en .env}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
      GUNICORN_CMD_ARGS: ${GUNICORN_CMD_ARGS:-}
      # Orígenes desde los que Django acepta formularios (HTTPS de nginx)
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://localhost}
      # Nombre del Hogar que crea la migración entidades/0003_hogar (HB-06). Sin valor por
      # defecto: en producción es obligatorio y config.settings.prod no arranca sin él. Si .env
      # no lo define llega vacío, y en desarrollo settings usa el de la demo.
      HOGAR_NOMBRE: ${HOGAR_NOMBRE:-}
      # Conexión a PostgreSQL: la aplicación NUNCA usa app_owner
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      DB_USER: app_user
      DB_PASSWORD: ${DB_APP_PASSWORD:?Falta DB_APP_PASSWORD en .env}
    volumes:
      - ./app:/app                 # el código del repositorio (makemigrations escribe aquí)
      - static:/app/staticfiles    # collectstatic escribe; nginx (HB-04) lo lee
    depends_on:
      db:
        condition: service_healthy # nunca arranca antes de que la base responda
    networks: [frontend, backend]
    # Sin "ports": el 8000 solo es visible para nginx dentro de la red frontend

  nginx:
    image: nginx:1.30.7-alpine     # versión fija (ADR-0025)
    restart: unless-stopped
    ports:
      - "80:80"      # solo redirige a 443
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - static:/static:ro          # lo que escribe collectstatic en web
    depends_on: [web]
    networks: [frontend]           # sin ruta a db: no está en la red backend

volumes:
  pgdata:
  static:

networks:
  backend:
  frontend:
